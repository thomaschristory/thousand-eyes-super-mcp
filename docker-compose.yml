services:
  thousand-eyes-mcp:
    build: .
    image: thousand-eyes-super-mcp:latest
    env_file: .env
    environment:
      - THOUSANDEYES_BEARER_TOKEN=${THOUSANDEYES_BEARER_TOKEN}
      - THOUSANDEYES_ACCOUNT_GROUP_ID=${THOUSANDEYES_ACCOUNT_GROUP_ID:-}
      - THOUSANDEYES_MCP_TOKEN=${THOUSANDEYES_MCP_TOKEN:-}
    volumes:
      - ./specs:/app/specs:ro
      - ./thousand-eyes-mcp.yaml:/app/thousand-eyes-mcp.yaml:ro
    # Default for compose: SSE transport on 8000 (network-accessible)
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped

