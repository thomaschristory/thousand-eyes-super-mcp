name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check thousand_eyes_mcp tests
      - name: Ruff format check
        run: uv run ruff format --check thousand_eyes_mcp tests
      - name: Mypy strict
        run: uv run mypy --strict thousand_eyes_mcp
