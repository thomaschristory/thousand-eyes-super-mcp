name: docker

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "thousand_eyes_mcp/**"
      - ".github/workflows/docker.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4
      - name: Build image (no push, smoke test only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          push: false
          load: true
          tags: thousand-eyes-super-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test — image prints help
        run: docker run --rm thousand-eyes-super-mcp:ci --help
